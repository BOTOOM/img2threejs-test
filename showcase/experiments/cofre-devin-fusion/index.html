<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cofre Devin Fusión: procedural crown chest rebuilt from a single image, with the reference image and a TRELLIS GLB as comparison baselines.">
  <title>Cofre Devin Fusión</title>
  <link rel="stylesheet" href="../../assets/showcase-shell.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="../../">← Atlas</a>
    <div class="title-block"><h1>Cofre Devin Fusión</h1><p>img2threejs v1.5-beta · eight passes · image and GLB baselines</p></div>
    <nav class="toolbar" aria-label="Scene controls">
      <a class="control" href="compare.html">Comparator</a>
      <a class="control" href="glb-viewer.html">View TRELLIS GLB</a>
      <button class="control primary" id="launchBtn" type="button">Launch scene</button>
      <button class="control" id="splitBtn" type="button" aria-pressed="false" disabled>Compare</button>
      <button class="control" id="reloadBtn" type="button" disabled>Reload</button>
    </nav>
  </header>
  <main class="workspace" id="workspace">
    <section class="stage" aria-label="Interactive procedural crown chest scene">
      <button class="reference-peek" id="referenceThumb" type="button" aria-label="Compare with the reference image">
        <img src="ref.png" alt="Reference image of a crown chest">
        <span>Reference · compare</span>
      </button>
      <div class="stage-empty" id="emptyState">
        <div class="mark" aria-hidden="true">◇</div>
        <h2>Interactive scene paused</h2>
        <p>Launch the procedural chest, or open the side-by-side comparator against the reference image and the TRELLIS GLB.</p>
        <button class="control primary" id="launchEmptyBtn" type="button">Launch 3D scene</button>
      </div>
      <iframe class="demo-frame" id="demo" title="Procedural crown chest interactive 3D scene" loading="lazy" hidden allow="fullscreen"></iframe>
      <p class="status" id="status" aria-live="polite" hidden></p>
    </section>
    <aside class="reference-panel" aria-label="Reference image">
      <figure><img src="ref.png" alt="Reference image of a crown chest"><figcaption>Expectation · source image</figcaption></figure>
    </aside>
  </main>
  <script src="../../assets/showcase-shell.js" defer></script>
</body>
</html>

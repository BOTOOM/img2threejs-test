<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="reloj Devin cloud — procedural Three.js reconstruction of Edward Elric's pocket watch. Compare the reference image with the live 3D scene.">
  <title>reloj Devin cloud — Edward Elric pocket watch</title>
  <link rel="stylesheet" href="../../assets/showcase-shell.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="../../">← Atlas</a>
    <div class="title-block"><h1>reloj Devin cloud — Edward Elric pocket watch</h1><p>Image-to-3D reconstruction · interactive study</p></div>
    <nav class="toolbar" aria-label="Scene controls">
      <button class="control primary" id="launchBtn" type="button">Launch scene</button>
      <button class="control" id="splitBtn" type="button" aria-pressed="false" disabled>Compare</button>
      <button class="control" id="reloadBtn" type="button" disabled>Reload</button>
      <a class="control" href="./compare-trellis.html">Compare with TRELLIS GLB</a>
    </nav>
  </header>
  <main class="workspace" id="workspace">
    <section class="stage" aria-label="Interactive 3D scene">
      <button class="reference-peek" id="referenceThumb" type="button" aria-label="Compare with the reference image">
        <img src="ref.png" alt="Reference image of Edward Elric's pocket watch">
        <span>Reference · compare</span>
      </button>
      <div class="stage-empty" id="emptyState">
        <div class="mark" aria-hidden="true">◇</div>
        <h2>Interactive scene paused</h2>
        <p>Launch the renderer when you are ready. Drag to orbit, scroll to zoom. The reference image stays available for comparison.</p>
        <button class="control primary" id="launchEmptyBtn" type="button">Launch 3D scene</button>
      </div>
      <iframe class="demo-frame" id="demo" title="reloj Devin cloud interactive 3D scene" loading="lazy" hidden allow="fullscreen"></iframe>
      <p class="status" id="status" aria-live="polite" hidden></p>
    </section>
    <aside class="reference-panel" aria-label="Reference image">
      <figure><img src="ref.png" alt="Reference image of Edward Elric's pocket watch"><figcaption>Expectation · source image</figcaption></figure>
    </aside>
  </main>
  <script src="../../assets/showcase-shell.js" defer></script>
</body>
</html>

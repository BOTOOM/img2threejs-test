<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Opus 5 two-cat reconstruction with selectable rendering passes.">
  <title>Opus 5 — Two Cats</title>
  <link rel="stylesheet" href="../../assets/showcase-shell.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="../../">← Atlas</a>
    <div class="title-block"><h1>Opus 5 — Two Cats</h1><p>Multi-pass reconstruction · choose a render stage</p></div>
    <nav class="toolbar" aria-label="Scene controls">
      <div class="pass-field"><label for="passSelect">Pass</label><select class="pass-select" id="passSelect"><option value="blockout" selected>Blockout · fast</option><option value="structural">Structural</option><option value="form-refinement">Form refinement</option><option value="material">Material</option><option value="surface">Surface</option><option value="lighting">Lighting · final</option></select></div>
      <button class="control primary" id="launchBtn" type="button">Launch scene</button>
      <button class="control" id="splitBtn" type="button" aria-pressed="false" disabled>Compare</button>
      <button class="control" id="reloadBtn" type="button" disabled>Reload</button>
    </nav>
  </header>
  <main class="workspace" id="workspace">
    <section class="stage" aria-label="Interactive Opus 5 3D scene">
      <button class="reference-peek" id="referenceThumb" type="button" aria-label="Compare with the reference image">
        <img src="ref.png" alt="Reference image of two cats">
        <span>Reference · compare</span>
      </button>
      <div class="stage-empty" id="emptyState">
        <div class="mark" aria-hidden="true">◇</div>
        <h2>Choose a pass, then launch</h2>
        <p>Blockout is the quickest way to inspect the form. Select Lighting when you want the full material treatment.</p>
        <button class="control primary" id="launchEmptyBtn" type="button">Launch 3D scene</button>
      </div>
      <iframe class="demo-frame" id="demo" title="Opus 5 interactive 3D scene" loading="lazy" hidden allow="fullscreen"></iframe>
      <p class="status" id="status" aria-live="polite" hidden></p>
    </section>
    <aside class="reference-panel" aria-label="Reference image">
      <figure><img src="ref.png" alt="Reference image of two cats"><figcaption>Expectation · source image</figcaption></figure>
    </aside>
  </main>
  <script src="../../assets/showcase-shell.js" defer></script>
</body>
</html>

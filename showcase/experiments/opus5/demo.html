<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stylized Cat Pair — review harness</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #14110e; color: #d9cfc2;
                   font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #wrap { position: relative; width: 100%; height: 100%; }
      canvas { width: 100%; height: 100%; display: block; background: #14110e; }
      #status { display: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.185.1/examples/jsm/",
          "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>
    <script>
      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason;
        const message = reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason);
        const status = document.getElementById('status');
        if (status) status.textContent = `Scene failed to initialize: ${message}`;
        console.error('Opus scene initialization failed', reason);
      });
    </script>
    <script type="module" crossorigin src="./assets/index-BDWankFX.js"></script>
  </head>
  <body>
    <div id="wrap">
      <div id="status">booting…</div>
      <canvas id="view" width="925" height="810"></canvas>
    </div>

  </body>
</html>

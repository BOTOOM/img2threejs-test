<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cofre GLB — Procedural Reconstruction</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: fixed;
      right: 16px;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      background: rgba(13, 15, 14, 0.92);
      box-shadow: 0 14px 32px rgba(0,0,0,0.35);
      color: #edf2eb;
      font-family: system-ui, sans-serif;
    }
    #ui a { color: #edf2eb; font-size: 0.78rem; font-weight: 700; text-decoration: none; }
    button { min-height: 40px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.14); border-radius: 9px; background: #1b1f1b; color: #edf2eb; cursor: pointer; font-weight: 700; }
    button:hover { background: #2a302a; }
    button:focus-visible, a:focus-visible { outline: 3px solid #e5b35a; outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="ui">
    <a class="back" href="../../">← Atlas</a>
    <button id="open">Open lid</button>
    <button id="close">Close lid</button>
    <a class="back" href="glb-viewer.html">View original GLB →</a>
  </div>
  <canvas id="canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { createCrownChestModel } from './src/createCrownChestModel.js';

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.75;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment()).texture;

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0.45, 0.32, 2.0);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.38, 0);
    controls.update();

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(1.8, 2.5, 2.0);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x99aaff, 0.7);
    fill.position.set(-1.5, 1.0, -1.0);
    scene.add(fill);

    const chest = createCrownChestModel();
    scene.add(chest);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.ShadowMaterial({ opacity: 0.25 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    let targetAngle = 0;
    document.getElementById('open').addEventListener('click', () => targetAngle = Math.PI * 0.45);
    document.getElementById('close').addEventListener('click', () => targetAngle = 0);

    function animate() {
      requestAnimationFrame(animate);
      chest.lidPivot.rotation.x = THREE.MathUtils.lerp(chest.lidPivot.rotation.x, -targetAngle, 0.08);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
